<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math 1 Midterm Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F9FD; --grid:rgba(75,156,211,.13); --surface:#FFFFFF; --ink:#13283D; --muted:#4F6478; --line:#D3DFEA;
  --blue:#4B9CD3; --blue-deep:#1B67A0; --blue-soft:#E4F1FA;
  --orange:#F56600; --orange-deep:#B04400; --orange-soft:#FFEDE0;
  --green:#1D7F52; --green-soft:#E2F5EA; --red:#B3261E; --red-soft:#FCE9E7; --teal:#25857B;
  --btn-bg:#1B67A0; --btn-ink:#FFFFFF; --on-fill:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A27; --grid:rgba(108,179,227,.09); --surface:#16273A; --ink:#E8F0F7; --muted:#9DB2C5; --line:#2C4259;
    --blue:#6CB3E3; --blue-deep:#8CC6F0; --blue-soft:#1B3A55;
    --orange:#FF8A3D; --orange-deep:#FFA566; --orange-soft:#3A2414;
    --green:#5CCB93; --green-soft:#153427; --red:#FF8F86; --red-soft:#3C1B19; --teal:#58C4B8;
    --btn-bg:#6CB3E3; --btn-ink:#0E1A27; --on-fill:#0E1A27;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A27; --grid:rgba(108,179,227,.09); --surface:#16273A; --ink:#E8F0F7; --muted:#9DB2C5; --line:#2C4259;
  --blue:#6CB3E3; --blue-deep:#8CC6F0; --blue-soft:#1B3A55;
  --orange:#FF8A3D; --orange-deep:#FFA566; --orange-soft:#3A2414;
  --green:#5CCB93; --green-soft:#153427; --red:#FF8F86; --red-soft:#3C1B19; --teal:#58C4B8;
  --btn-bg:#6CB3E3; --btn-ink:#0E1A27; --on-fill:#0E1A27;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:17px/1.55 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px 18px 72px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
.brand{background:none;border:0;padding:6px 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;color:var(--ink)}
.nav{display:flex;gap:6px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);min-height:40px}
.nav button:hover{background:var(--blue-soft);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--orange)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn:hover{border-color:var(--blue-deep)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;margin:6px 0 30px}
.hero h1{font-size:clamp(34px,6.4vw,56px);font-weight:800;letter-spacing:-.025em;margin-bottom:14px}
.lead{font-size:19px;max-width:44ch;margin:0 0 20px;color:var(--muted)}
.hero-svg{width:100%;height:auto;display:block;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
@media (max-width:700px){.hero{grid-template-columns:1fr}}

/* section cards on home */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-left:7px solid var(--tabc,var(--blue));border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:22px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:16px}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tabc,var(--blue));transition:width .3s}
.stat{font-size:15px;color:var(--muted)}
.card .row{margin-top:auto}
.note{color:var(--muted);max-width:68ch;margin:26px 0 0;font-size:16px}

/* section view */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 22px}
.sec-head h1{font-size:clamp(26px,4.6vw,38px);font-weight:800;border-left:7px solid var(--tabc,var(--blue));padding-left:14px}
.tabs{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{background:none;border:0;padding:10px 20px;min-height:44px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--btn-bg);color:var(--btn-ink)}
.back{background:none;border:0;padding:4px 0;color:var(--blue-deep);font-weight:700;margin-bottom:6px}

/* review topics */
.topic{background:var(--surface);border:1.5px solid var(--line);border-left:7px solid var(--tabc,var(--blue));border-radius:10px;padding:22px 24px;margin-bottom:18px}
.topic h2{font-size:23px;font-weight:800;margin-bottom:10px}
.topic p{max-width:66ch;margin:0 0 12px}
.eg,.watch{border-radius:8px;padding:12px 16px;margin:14px 0;max-width:70ch}
.eg{background:var(--blue-soft);border:1px solid var(--blue)}
.watch{background:var(--orange-soft);border:1px solid var(--orange)}
.eg b:first-child,.watch b:first-child{font-weight:700}
.topic .btn{margin-top:6px}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.jump button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;min-height:38px}
.jump button:hover{border-color:var(--blue-deep)}

/* fractions + math */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .18em;font-size:.95em}
.frac .n{border-bottom:1.5px solid currentColor;padding:0 .25em 1px}
.frac .d{padding:1px .25em 0}
.work{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:12px 0;line-height:1.9}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}

/* figures */
.fig{width:100%;max-width:560px;height:auto;display:block;margin:12px 0}
.fig.hist{max-width:360px}
.trio .fig.hist{max-width:100%;margin:0}
.fg-txt{fill:var(--muted);font:13px 'Atkinson Hyperlegible',system-ui,sans-serif}
.fg-lab{fill:var(--ink);font-weight:700}
.fg-grid{stroke:var(--line);stroke-width:1}
.fg-axis{stroke:var(--ink);stroke-width:1.5}
.fg-whisk{stroke:var(--ink);stroke-width:2}
.fg-box{fill:var(--blue-soft);stroke:var(--blue-deep);stroke-width:2}
.fg-med{stroke:var(--orange);stroke-width:3.5}
.fg-bar{fill:var(--blue)}
.fg-poly{fill:var(--blue-soft);stroke:var(--blue-deep);stroke-width:2;fill-opacity:.9}
.fg-dash{stroke:var(--orange);stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.fg-seg{stroke:var(--blue-deep);stroke-width:2.5}
.fg-pt{fill:var(--blue-deep)}
.fg-mid{fill:var(--orange)}
.fg-yes{fill:var(--green)}
.fg-no{fill:var(--red)}
.fg-pl{fill:var(--ink);font:700 13px 'Atkinson Hyperlegible',system-ui,sans-serif}

/* practice */
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;padding:0}
.dot:hover{border-color:var(--blue-deep)}
.dot.cur{box-shadow:0 0 0 3px var(--blue)}
.dot.ok{background:var(--green);border-color:var(--green);color:var(--on-fill)}
.dot.retry{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.dot.rev{background:var(--orange);border-color:var(--orange);color:var(--on-fill)}
.dot.tried{border-color:var(--orange);color:var(--orange-deep)}
.legend{font-size:14px;color:var(--muted);margin:-6px 0 18px}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:22px 24px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-bottom:10px}
.qprompt{font-size:19px;max-width:62ch;margin:0 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;margin:9px 0;cursor:pointer;background:var(--surface);max-width:620px}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:6px;accent-color:var(--blue-deep);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--blue-deep);background:var(--blue-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.good{border-color:var(--green);background:var(--green-soft)}
.numrow{display:flex;gap:10px;align-items:center;margin:14px 0}
.numrow input{font:inherit;width:190px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-height:46px}
.numrow input:disabled{opacity:.8}
.qt{border-collapse:collapse;margin:12px 0;width:100%;max-width:640px}
.qt th,.qt td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.qt th{font-weight:700;color:var(--muted);font-size:15px}
.qt select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:42px;max-width:100%}
.qt tr.good td{background:var(--green-soft)}
.qt tr.bad td{background:var(--red-soft)}
.qt .st{font-size:14px;font-weight:700}
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.conf .l{font-weight:700;margin-right:4px}
.conf button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;min-height:40px}
.conf button:hover{border-color:var(--blue-deep)}
.conf button.on{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hintbox,.fb,.sol{border-radius:9px;padding:13px 16px;margin-top:14px;max-width:68ch}
.hintbox{background:var(--orange-soft);border:1.5px solid var(--orange)}
.fb{border:1.5px solid}
.fb.ok{background:var(--green-soft);border-color:var(--green)}
.fb.no{background:var(--red-soft);border-color:var(--red)}
.fb.info{background:var(--blue-soft);border-color:var(--blue)}
.fb:focus{outline:none}
.sol{background:var(--blue-soft);border:1.5px solid var(--blue)}
.fb p,.sol p{margin:6px 0 0}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--blue-deep);font-weight:700;text-decoration:underline;min-height:0}

/* progress */
.pgrid{display:grid;gap:14px;margin:16px 0 26px}
.prow{background:var(--surface);border:1.5px solid var(--line);border-left:7px solid var(--tabc,var(--blue));border-radius:10px;padding:16px 18px}
.prow h3{font-size:19px;margin-bottom:8px}
.pl{margin:10px 0 0;padding-left:20px}
.pl li{margin:6px 0}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.panel h2{font-size:21px;margin-bottom:6px}
.panel p{margin:6px 0;max-width:66ch}
.studyrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.studyrow:first-of-type{border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.wrap{padding:12px 14px 60px}.qcard{padding:18px 16px}.topic{padding:18px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home">Math 1 Midterm Review</button>
    <nav class="nav" aria-label="Main">
      <button data-act="home" id="nav-home">Topics</button>
      <button data-act="progress" id="nav-progress">My progress</button>
    </nav>
  </header>
  <main id="app"></main>
  <noscript>This review needs JavaScript turned on to work.</noscript>
</div>

<script>
/* ---------- helpers ---------- */
var F = function (n, d) { return '<span class="frac"><span class="n">' + n + '</span><span class="d">' + d + '</span></span>'; };
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function parseNum(s) {
  s = String(s).trim().replace(/\u2212/g, '-').replace(/\s+/g, '').replace(/,/g, '').replace(/^\$/, '').replace(/^[a-z]=/i, '');
  var m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) { var d = parseFloat(m[2]); if (d === 0) return NaN; return parseFloat(m[1]) / d; }
  if (/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;
}

/* ---------- figures ---------- */
function boxplotSVG(items, lo, hi, step, xLabel, aria) {
  var W = 560, left = 74, right = 22, rowH = 46, top = 10, axisH = 46;
  var H = top + items.length * rowH + axisH;
  function sx(v) { return left + (v - lo) / (hi - lo) * (W - left - right); }
  var s = '<svg class="fig" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
  for (var v = lo; v <= hi + 1e-9; v += step) {
    var x = sx(v);
    s += '<line class="fg-grid" x1="' + x + '" y1="' + top + '" x2="' + x + '" y2="' + (H - axisH + 4) + '"/>';
    s += '<text class="fg-txt" x="' + x + '" y="' + (H - axisH + 22) + '" text-anchor="middle">' + v + '</text>';
  }
  s += '<text class="fg-txt" x="' + ((left + W - right) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + xLabel + '</text>';
  items.forEach(function (it, i) {
    var y = top + i * rowH + rowH / 2;
    s += '<text class="fg-txt fg-lab" x="' + (left - 10) + '" y="' + (y + 5) + '" text-anchor="end">' + it.label + '</text>';
    s += '<line class="fg-whisk" x1="' + sx(it.min) + '" y1="' + y + '" x2="' + sx(it.q1) + '" y2="' + y + '"/>';
    s += '<line class="fg-whisk" x1="' + sx(it.q3) + '" y1="' + y + '" x2="' + sx(it.max) + '" y2="' + y + '"/>';
    s += '<line class="fg-whisk" x1="' + sx(it.min) + '" y1="' + (y - 8) + '" x2="' + sx(it.min) + '" y2="' + (y + 8) + '"/>';
    s += '<line class="fg-whisk" x1="' + sx(it.max) + '" y1="' + (y - 8) + '" x2="' + sx(it.max) + '" y2="' + (y + 8) + '"/>';
    s += '<rect class="fg-box" x="' + sx(it.q1) + '" y="' + (y - 14) + '" width="' + (sx(it.q3) - sx(it.q1)) + '" height="28" rx="2"/>';
    s += '<line class="fg-med" x1="' + sx(it.med) + '" y1="' + (y - 14) + '" x2="' + sx(it.med) + '" y2="' + (y + 14) + '"/>';
  });
  return s + '</svg>';
}

function histSVG(h, xLabel, aria) {
  var W = 300, Ht = 170, pad = 14, base = Ht - 34, n = h.length, bw = (W - 2 * pad) / n, mx = Math.max.apply(null, h);
  var s = '<svg class="fig hist" viewBox="0 0 ' + W + ' ' + Ht + '" role="img" aria-label="' + esc(aria) + '">';
  h.forEach(function (v, i) {
    var bh = v / mx * (base - 14);
    s += '<rect class="fg-bar" x="' + (pad + i * bw + 1.5) + '" y="' + (base - bh) + '" width="' + (bw - 3) + '" height="' + bh + '" rx="1.5"/>';
  });
  s += '<line class="fg-axis" x1="' + pad + '" y1="' + base + '" x2="' + (W - pad) + '" y2="' + base + '"/>';
  s += '<text class="fg-txt" x="' + (W / 2) + '" y="' + (Ht - 10) + '" text-anchor="middle">' + xLabel + '</text></svg>';
  return s;
}

function regionSVG() {
  var W = 520, H = 262, l = 54, b = 44, t = 14, r = 16;
  function px(v) { return l + v / 34 * (W - l - r); }
  function py(v) { return H - b - v / 16 * (H - b - t); }
  var s = '<svg class="fig" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Shaded region where x plus y is at most 30, y is at most 12, and x and y are not negative. The point (20, 8) is inside the region. The point (20, 12) is outside.">';
  [0, 10, 20, 30].forEach(function (v) {
    s += '<line class="fg-grid" x1="' + px(v) + '" y1="' + py(0) + '" x2="' + px(v) + '" y2="' + py(16) + '"/>';
    s += '<text class="fg-txt" x="' + px(v) + '" y="' + (py(0) + 18) + '" text-anchor="middle">' + v + '</text>';
  });
  [0, 4, 8, 12].forEach(function (v) {
    s += '<line class="fg-grid" x1="' + px(0) + '" y1="' + py(v) + '" x2="' + px(34) + '" y2="' + py(v) + '"/>';
    s += '<text class="fg-txt" x="' + (px(0) - 8) + '" y="' + (py(v) + 4) + '" text-anchor="end">' + v + '</text>';
  });
  s += '<polygon class="fg-poly" points="' + px(0) + ',' + py(0) + ' ' + px(30) + ',' + py(0) + ' ' + px(18) + ',' + py(12) + ' ' + px(0) + ',' + py(12) + '"/>';
  s += '<line class="fg-axis" x1="' + px(0) + '" y1="' + py(0) + '" x2="' + px(34) + '" y2="' + py(0) + '"/>';
  s += '<line class="fg-axis" x1="' + px(0) + '" y1="' + py(0) + '" x2="' + px(0) + '" y2="' + py(16) + '"/>';
  s += '<line class="fg-dash" x1="' + px(14) + '" y1="' + py(16) + '" x2="' + px(30) + '" y2="' + py(0) + '"/>';
  s += '<line class="fg-dash" x1="' + px(0) + '" y1="' + py(12) + '" x2="' + px(34) + '" y2="' + py(12) + '"/>';
  s += '<text class="fg-pl" x="' + (px(23.5)) + '" y="' + (py(8.5)) + '">x + y = 30</text>';
  s += '<text class="fg-pl" x="' + (px(23)) + '" y="' + (py(12) - 7) + '">y = 12</text>';
  s += '<circle class="fg-yes" cx="' + px(20) + '" cy="' + py(8) + '" r="5.5"/><text class="fg-pl" x="' + (px(20) - 8) + '" y="' + (py(8) + 17) + '" text-anchor="end">(20, 8) inside</text>';
  s += '<circle class="fg-no" cx="' + px(20) + '" cy="' + py(12) + '" r="5.5"/><text class="fg-pl" x="' + (px(20) - 8) + '" y="' + (py(12) - 9) + '" text-anchor="end">(20, 12) outside</text>';
  s += '<text class="fg-txt" x="' + ((px(0) + px(34)) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">mugs, x</text>';
  s += '<text class="fg-txt" transform="translate(14 ' + ((py(0) + py(16)) / 2) + ') rotate(-90)" text-anchor="middle">plates, y</text>';
  return s + '</svg>';
}

function heroSVG() {
  var s = '<svg class="hero-svg" viewBox="0 0 260 200" role="img" aria-label="A coordinate plane with a segment from point A to point B and its midpoint M.">';
  for (var i = 0; i <= 13; i++) s += '<line class="fg-grid" x1="' + (i * 20) + '" y1="0" x2="' + (i * 20) + '" y2="200"/>';
  for (var j = 0; j <= 10; j++) s += '<line class="fg-grid" x1="0" y1="' + (j * 20) + '" x2="260" y2="' + (j * 20) + '"/>';

/* build lookup tables and table-question solutions */
var TOPIC = {}, PROB = {}, ORDER = {};
SECTIONS.forEach(function (sec) {
  sec.topics.forEach(function (t) { TOPIC[t.id] = { sec: sec, title: t.title }; });
  sec.problems.forEach(function (p) {
    PROB[p.id] = { sec: sec, p: p };
    if (p.type === 'mc') ORDER[p.id] = shuffle(p.options.map(function (_, i) { return i; }));
    if (p.type === 'table') {
      p.sol = '<ul class="pl">' + p.rows.map(function (r) { return '<li><b>' + r.label + '</b> ' + r.ans + '. ' + r.why + '</li>'; }).join('') + '</ul>';
    }
  });
});

/* ---------- state ---------- */
var KEY = 'm1-midterm-review-v1';
var store = { p: {} };
try { var raw = window.localStorage.getItem(KEY); if (raw) { var parsed = JSON.parse(raw); if (parsed && parsed.p) store = parsed; } } catch (e) { }
function save() { try { window.localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { } }
function blank() { return { att: 0, first: null, solved: false, rev: false, conf: null, hint: false }; }
function get(id) { return store.p[id] || blank(); }
function rec(id) { return store.p[id] || (store.p[id] = blank()); }
var UI = {};
function U(id) { return UI[id] || (UI[id] = { sel: null, txt: '', tab: {}, conf: null, hint: false, fb: null, msg: '', showSol: false }); }
var v = { name: 'home', sec: null, tab: 'review', idx: 0, confirm: false };
var app = document.getElementById('app');

function secById(id) { return SECTIONS.filter(function (s) { return s.id === id; })[0]; }
function counts(sec) {
  var solved = 0, first = 0;
  sec.problems.forEach(function (p) { var r = get(p.id); if (r.solved) solved++; if (r.first === true) first++; });
  return { solved: solved, first: first, total: sec.problems.length };
}

/* ---------- views ---------- */
function homeView() {
  return '<section class="hero"><div>' +
    '<h1>Get ready for the midterm</h1>' +
    '<p class="lead">Pick a topic, skim the quick review, then practice. Every answer comes with feedback that explains what went wrong, not just that it did.</p>' +
    '<button class="btn primary" data-act="open" data-sec="linear" data-tab="review">Start with linear equations</button>' +
    '</div><div>' + heroSVG() + '</div></section>' +
    '<div class="cards">' + SECTIONS.map(function (sec) {
      var c = counts(sec), pct = Math.round(c.solved / c.total * 100);
      return '<article class="card" style="--tabc:' + sec.color + '">' +
        '<h2>' + sec.title + '</h2><p>' + sec.blurb + '</p>' +
        '<div class="bar" role="img" aria-label="' + c.solved + ' of ' + c.total + ' questions solved"><i style="width:' + pct + '%"></i></div>' +
        '<div class="stat">' + c.solved + ' of ' + c.total + ' questions solved</div>' +
        '<div class="row"><button class="btn" data-act="open" data-sec="' + sec.id + '" data-tab="review">Review</button>' +
        '<button class="btn primary" data-act="open" data-sec="' + sec.id + '" data-tab="practice">Practice</button></div></article>';
    }).join('') + '</div>' +
    '<p class="note">How practice works: choose how sure you feel, answer, and check. You can ask for a hint, try again, or open the full solution. Your progress is saved on this device.</p>';
}

function sectionView(sec) {
  var head = '<button class="back" data-act="home">Back to topics</button>' +
    '<div class="sec-head" style="--tabc:' + sec.color + '"><h1>' + sec.title + '</h1>' +
    '<div class="tabs" role="group" aria-label="Review or practice">' +
    '<button data-act="tab" data-tab="review"' + (v.tab === 'review' ? ' aria-current="page"' : '') + '>Review</button>' +
    '<button data-act="tab" data-tab="practice"' + (v.tab === 'practice' ? ' aria-current="page"' : '') + '>Practice</button></div></div>';
  return head + (v.tab === 'review' ? reviewView(sec) : practiceView(sec));
}

function reviewView(sec) {
  var jump = '<div class="jump" aria-label="Jump to a topic">' + sec.topics.map(function (t) {
    return '<button data-act="scroll" data-topic="' + t.id + '">' + t.title + '</button>';
  }).join('') + '</div>';
  return jump + sec.topics.map(function (t) {
    var has = sec.problems.some(function (p) { return p.topic === t.id; });
    return '<section class="topic" id="topic-' + t.id + '" style="--tabc:' + sec.color + '"><h2>' + t.title + '</h2>' + t.html +
      (has ? '<button class="btn small" data-act="practice-topic" data-topic="' + t.id + '">Practice this topic</button>' : '') + '</section>';
  }).join('');
}

function dotClass(id) {
  var r = get(id);
  if (r.solved) return r.first ? 'ok' : 'retry';
  if (r.rev) return 'rev';
  if (r.att > 0) return 'tried';
  return '';
}
function dotLabel(id, n) {
  var r = get(id), st = 'not started';
  if (r.solved) st = r.first ? 'solved on the first try' : 'solved after retrying';
  else if (r.rev) st = 'solution viewed';
  else if (r.att > 0) st = 'attempted';
  return 'Question ' + n + ', ' + st;
}

function practiceView(sec) {
  var p = sec.problems[v.idx];
  var dots = '<div class="dots" id="practice-top" role="group" aria-label="Questions">' + sec.problems.map(function (q, i) {
    return '<button class="dot ' + dotClass(q.id) + (i === v.idx ? ' cur' : '') + '" data-act="goto" data-idx="' + i + '" aria-label="' + dotLabel(q.id, i + 1) + '"' + (i === v.idx ? ' aria-current="true"' : '') + '>' + (i + 1) + '</button>';
  }).join('') + '</div>' +
    '<p class="legend">Filled green: solved on the first try. Light green: solved after trying again. Orange: solution viewed.</p>';
  var nav = '<div class="qnav"><button class="btn" data-act="prev"' + (v.idx === 0 ? ' disabled style="opacity:.5;cursor:default"' : '') + '>Previous</button>' +
    (v.idx < sec.problems.length - 1
      ? '<button class="btn primary" data-act="next">Next question</button>'
      : '<button class="btn primary" data-act="progress">See my progress</button>') + '</div>';
  return dots + problemCard(sec, p, v.idx) + nav;
}

function problemCard(sec, p, i) {
  var r = get(p.id), u = U(p.id);
  var locked = r.solved;
  var out = '<div class="qcard"><div class="qmeta"><span>Question ' + (i + 1) + ' of ' + sec.problems.length + '</span><span>' + TOPIC[p.topic].title + '</span></div>';
  out += '<p class="qprompt">' + p.prompt + '</p>';
  if (p.fig) out += FIGS[p.fig]();

  if (p.type === 'mc') {
    out += '<div role="radiogroup" aria-label="Answer choices">' + ORDER[p.id].map(function (k) {
      var o = p.options[k], cls = ['opt'];
      if (u.sel === k) { cls.push('sel'); if (u.fb) cls.push(u.fb.ok ? 'good' : 'bad'); }
      if (locked && o.ok) cls.push('good');
      return '<label class="' + cls.join(' ') + '"><input type="radio" name="opt-' + p.id + '" value="' + k + '"' + (u.sel === k ? ' checked' : '') + (locked ? ' disabled' : '') + '><span>' + o.h + '</span></label>';
    }).join('') + '</div>';
  } else if (p.type === 'num') {
    out += '<div class="numrow"><label for="numin" class="stat">Your answer</label><input id="numin" type="text" inputmode="text" autocomplete="off" value="' + esc(locked && !u.txt ? p.answer : u.txt) + '"' + (locked ? ' disabled' : '') + '>' + (p.unit ? '<span>' + p.unit + '</span>' : '') + '</div>';
  } else if (p.type === 'table') {
    out += '<table class="qt"><thead><tr><th scope="col">Statement</th><th scope="col">Your choice</th><th scope="col">Result</th></tr></thead><tbody>' + p.rows.map(function (row, k) {
      var res = u.fb && u.fb.rows ? u.fb.rows[k] : null;
      var cur = u.tab[k];
      if (locked && cur === undefined) cur = row.ans;
      var cls = res ? (res.ok ? 'good' : 'bad') : (locked ? 'good' : '');
      return '<tr class="' + cls + '"><th scope="row" style="font-weight:400;color:inherit;font-size:inherit">' + row.label + '</th><td><select data-row="' + k + '" aria-label="' + esc(row.label) + '"' + (locked ? ' disabled' : '') + '>' +
        '<option value=""' + (cur ? '' : ' selected') + '>Choose\u2026</option>' + row.choices.map(function (c) { return '<option' + (cur === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
        '</select></td><td class="st">' + (res ? (res.ok ? 'Correct' : 'Look again') : '') + '</td></tr>';
    }).join('') + '</tbody></table>';
  }

  if (r.att === 0 && !locked) {
    out += '<div class="conf" role="group" aria-label="How sure are you?"><span class="l">How sure are you?</span>' +
      [['guess', 'Just guessing'], ['pretty', 'Pretty sure'], ['certain', 'Certain']].map(function (c) {
        return '<button data-act="conf" data-v="' + c[0] + '" aria-pressed="' + (u.conf === c[0]) + '" class="' + (u.conf === c[0] ? 'on' : '') + '">' + c[1] + '</button>';
      }).join('') + '</div>';
  }

  var wrong = u.fb && !u.fb.ok;
  if (!locked) {
    out += '<div class="actions">';
    out += wrong ? '<button class="btn primary" data-act="retry">Try again</button>' : '<button class="btn primary" data-act="check">Check answer</button>';
    if (!u.hint && p.hint) out += '<button class="btn" data-act="hint">Show a hint</button>';
    if (r.att > 0 && !u.showSol) out += '<button class="btn" data-act="solution">Show solution</button>';
    out += '</div>';
  }
  if (u.hint && !locked) out += '<div class="hintbox"><b>Hint.</b> ' + p.hint + '</div>';

  out += '<div id="fb" tabindex="-1" aria-live="polite">';
  if (u.msg) out += '<div class="fb info">' + u.msg + '</div>';
  if (u.fb) {
    if (u.fb.ok) out += '<div class="fb ok"><b>Correct.</b>' + (r.att > 1 ? ' Nice work sticking with it.' : '') + '</div>';
    else out += '<div class="fb no"><b>Not yet.</b> ' + u.fb.why + (u.fb.over ? '<p>You marked this one as certain, so it is worth a second look at <button class="linkbtn" data-act="to-review" data-topic="' + p.topic + '">' + TOPIC[p.topic].title + '</button>.</p>' : '') + '</div>';
  }
  out += '</div>';

  if (locked || u.showSol) {
    out += '<div class="sol"><b>Solution.</b> ' + (p.type === 'table' ? '' : p.sol) + (p.type === 'table' ? p.sol : '') + (p.solFig ? FIGS[p.solFig]() : '') + '</div>';
  }
  return out + '</div>';
}

function progressView() {
  var total = 0, solved = 0, firstOk = 0, attempted = 0, missed = {}, over = [], lucky = [];
  SECTIONS.forEach(function (sec) {
    sec.problems.forEach(function (p) {
      total++;
      var r = store.p[p.id];
      if (!r) return;
      if (r.att > 0) attempted++;
      if (r.solved) solved++;
      if (r.first === true) firstOk++;
      if (r.first === false) {
        (missed[p.topic] = missed[p.topic] || []).push(p.id);
        if (r.conf === 'certain' || r.conf === 'pretty') over.push(p.id);
      }
      if (r.first === true && r.conf === 'guess') lucky.push(p.id);
    });
  });
  var summary = attempted === 0
    ? 'You have not answered any practice questions yet. Once you do, this page will show what to study next.'
    : 'You have solved ' + solved + ' of ' + total + ' questions and got ' + firstOk + ' right on the first try.';
  var out = '<h1 style="font-size:clamp(28px,5vw,40px);font-weight:800;margin:6px 0 8px">My progress</h1><p style="max-width:62ch;margin:0 0 6px">' + summary + '</p>';
  out += '<div class="pgrid">' + SECTIONS.map(function (sec) {
    var c = counts(sec), pct = Math.round(c.solved / c.total * 100);
    return '<div class="prow" style="--tabc:' + sec.color + '"><h3>' + sec.title + '</h3>' +
      '<div class="bar" role="img" aria-label="' + c.solved + ' of ' + c.total + ' solved"><i style="width:' + pct + '%"></i></div>' +
      '<div class="stat" style="margin-top:6px">' + c.solved + ' of ' + c.total + ' solved, ' + c.first + ' right on the first try</div></div>';
  }).join('') + '</div>';

  var topics = Object.keys(missed).sort(function (a, b) { return missed[b].length - missed[a].length; });
  out += '<section class="panel"><h2>Study next</h2>';
  if (!topics.length) out += '<p>' + (attempted ? 'No first-try misses so far. Keep going through the rest of the practice questions.' : 'Answer a few practice questions and your list will show up here.') + '</p>';
  else {
    out += '<p>These topics had questions you missed on the first try. Start at the top.</p>';
    out += topics.map(function (tid) {
      var t = TOPIC[tid], n = missed[tid].length;
      return '<div class="studyrow"><div><b>' + t.title + '</b><br><span class="stat">' + n + (n === 1 ? ' question' : ' questions') + ' missed</span></div><div class="row">' +
        '<button class="btn small" data-act="to-review" data-topic="' + tid + '">Review</button>' +
        '<button class="btn small primary" data-act="practice-topic" data-topic="' + tid + '">Practice</button></div></div>';
    }).join('');
  }
  out += '</section>';

  if (over.length) {
    out += '<section class="panel"><h2>You felt sure, but missed these</h2><p>These are the most useful ones to revisit, because a wrong answer you felt good about is the kind that shows up on a test.</p><ul class="pl">' +
      over.map(function (id) { var e = PROB[id]; return '<li><button class="linkbtn" data-act="open-q" data-id="' + id + '">Question ' + (e.sec.problems.indexOf(e.p) + 1) + ' in ' + e.sec.short + '</button>, ' + TOPIC[e.p.topic].title.toLowerCase() + '</li>'; }).join('') + '</ul></section>';
  }
  if (lucky.length) {
    out += '<section class="panel"><h2>Right, but you weren’t sure</h2><p>Read the solutions for these to lock in why they work.</p><ul class="pl">' +
      lucky.map(function (id) { var e = PROB[id]; return '<li><button class="linkbtn" data-act="open-q" data-id="' + id + '">Question ' + (e.sec.problems.indexOf(e.p) + 1) + ' in ' + e.sec.short + '</button>, ' + TOPIC[e.p.topic].title.toLowerCase() + '</li>'; }).join('') + '</ul></section>';
  }
  out += '<section class="panel"><h2>Start over</h2>';
  out += v.confirm
    ? '<p>This clears your answers and progress on this device.</p><div class="row"><button class="btn primary" data-act="reset-yes">Yes, clear my progress</button><button class="btn" data-act="reset-no">Cancel</button></div>'
    : '<p>Clear your answers and progress on this device.</p><button class="btn" data-act="reset">Reset progress</button>';
  return out + '</section>';
}

/* ---------- render ---------- */
function render(opts) {
  opts = opts || {};
  var html;
  if (v.name === 'home') html = homeView();
  else if (v.name === 'progress') html = progressView();
  else html = sectionView(secById(v.sec));
  app.innerHTML = html;
  document.getElementById('nav-home').removeAttribute('aria-current');
  document.getElementById('nav-progress').removeAttribute('aria-current');
  if (v.name === 'home') document.getElementById('nav-home').setAttribute('aria-current', 'page');
  if (v.name === 'progress') document.getElementById('nav-progress').setAttribute('aria-current', 'page');
  if (opts.focusFb) { var f = document.getElementById('fb'); if (f) { f.focus({ preventScroll: true }); try { f.scrollIntoView({ block: 'nearest' }); } catch (e) { } } }
  else if (opts.scrollTop) window.scrollTo(0, 0);
  else if (opts.scrollTopic) { var el = document.getElementById('topic-' + opts.scrollTopic); if (el) el.scrollIntoView({ block: 'start' }); }
  else if (opts.scrollPractice) { var pt = document.getElementById('practice-top'); if (pt) pt.scrollIntoView({ block: 'start' }); }
}

/* ---------- actions ---------- */
function curProblem() { return secById(v.sec).problems[v.idx]; }

function doCheck() {
  var p = curProblem(), r = get(p.id), u = U(p.id);
  u.msg = '';
  var answered = false, ok = false, why = '', rows = null;
  if (p.type === 'mc') {
    answered = u.sel !== null;
    if (answered) { var o = p.options[u.sel]; ok = !!o.ok; why = o.why || ''; }
  } else if (p.type === 'num') {
    var val = parseNum(u.txt);
    if (String(u.txt).trim() === '') { u.msg = 'Type your answer first.'; render({ focusFb: true }); return; }
    if (isNaN(val)) { u.msg = 'Enter a number, like 4, \u22122.5, or 5/2.'; render({ focusFb: true }); return; }
    answered = true;
    ok = Math.abs(val - p.answer) <= p.tol;
    if (!ok) {
      var w = (p.wrong || []).filter(function (x) { return x.t(val); })[0];
      why = w ? w.why : p.generic;
    }
  } else if (p.type === 'table') {
    answered = p.rows.every(function (row, k) { return !!u.tab[k]; });
    if (answered) {
      rows = p.rows.map(function (row, k) { return { ok: u.tab[k] === row.ans }; });
      ok = rows.every(function (x) { return x.ok; });
      why = 'Some rows need another look. They are marked in the table. Change them and check again.';
    }
  }
  if (!answered) { u.msg = p.type === 'table' ? 'Answer every row first.' : 'Choose an answer first.'; render({ focusFb: true }); return; }
  if (r.att === 0 && !u.conf) { u.msg = 'Pick how sure you feel, then check your answer.'; render({ focusFb: true }); return; }

  var rr = rec(p.id);
  rr.att++;
  var firstTry = rr.first === null;
  if (firstTry) { rr.first = ok; rr.conf = u.conf || null; rr.hint = !!u.hint; }
  if (ok) rr.solved = true;
  u.fb = { ok: ok, why: why, rows: rows, over: firstTry && !ok && u.conf === 'certain' };
  save();
  render({ focusFb: true });
}

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-act');
  if (a === 'home') { v = { name: 'home', sec: null, tab: 'review', idx: 0, confirm: false }; render({ scrollTop: true }); }
  else if (a === 'progress') { v = { name: 'progress', sec: null, tab: 'review', idx: 0, confirm: false }; render({ scrollTop: true }); }
  else if (a === 'open') { v = { name: 'section', sec: b.getAttribute('data-sec'), tab: b.getAttribute('data-tab'), idx: 0, confirm: false }; render({ scrollTop: true }); }
  else if (a === 'tab') { v.tab = b.getAttribute('data-tab'); render({ scrollTop: true }); }
  else if (a === 'goto') { v.idx = parseInt(b.getAttribute('data-idx'), 10); render({ scrollPractice: true }); }
  else if (a === 'next') { var n = secById(v.sec).problems.length; if (v.idx < n - 1) { v.idx++; render({ scrollPractice: true }); } }
  else if (a === 'prev') { if (v.idx > 0) { v.idx--; render({ scrollPractice: true }); } }
  else if (a === 'scroll') { var el = document.getElementById('topic-' + b.getAttribute('data-topic')); if (el) el.scrollIntoView({ block: 'start' }); }
  else if (a === 'practice-topic' || a === 'to-review') {
    var tid = b.getAttribute('data-topic'), sec = TOPIC[tid].sec;
    if (a === 'to-review') { v = { name: 'section', sec: sec.id, tab: 'review', idx: 0, confirm: false }; render({ scrollTopic: tid }); }
    else {
      var idx = 0;
      for (var i = 0; i < sec.problems.length; i++) { if (sec.problems[i].topic === tid) { idx = i; if (!get(sec.problems[i].id).solved) break; } }
      v = { name: 'section', sec: sec.id, tab: 'practice', idx: idx, confirm: false }; render({ scrollTop: true });
    }
  }
  else if (a === 'open-q') { var e2 = PROB[b.getAttribute('data-id')]; v = { name: 'section', sec: e2.sec.id, tab: 'practice', idx: e2.sec.problems.indexOf(e2.p), confirm: false }; render({ scrollTop: true }); }
  else if (a === 'conf') {
    var p = curProblem(), u = U(p.id); u.conf = b.getAttribute('data-v');
    var group = b.parentNode.querySelectorAll('button[data-act="conf"]');
    for (var k = 0; k < group.length; k++) { var on = group[k] === b; group[k].classList.toggle('on', on); group[k].setAttribute('aria-pressed', on ? 'true' : 'false'); }
  }
  else if (a === 'check') doCheck();
  else if (a === 'retry') {
    var p2 = curProblem(), u2 = U(p2.id); u2.fb = null; u2.msg = '';
    if (p2.type === 'mc') u2.sel = null;
    if (p2.type === 'num') u2.txt = '';
    render({});
    var inp = document.getElementById('numin'); if (inp) inp.focus();
  }
  else if (a === 'hint') { var p3 = curProblem(); U(p3.id).hint = true; render({}); }
  else if (a === 'solution') { var p4 = curProblem(), u4 = U(p4.id); u4.showSol = true; var rr = rec(p4.id); if (!rr.solved) rr.rev = true; save(); render({}); }
  else if (a === 'reset') { v.confirm = true; render({}); }
  else if (a === 'reset-no') { v.confirm = false; render({}); }
  else if (a === 'reset-yes') { store = { p: {} }; UI = {}; save(); v.confirm = false; render({ scrollTop: true }); }
});

app.addEventListener('change', function (e) {
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var p = curProblem(), u = U(p.id); u.sel = parseInt(t.value, 10);
    var labels = t.closest('[role="radiogroup"]').querySelectorAll('.opt');
    for (var i = 0; i < labels.length; i++) labels[i].classList.remove('sel');
    t.closest('.opt').classList.add('sel');
  } else if (t.matches('select[data-row]')) {
    var p2 = curProblem(); U(p2.id).tab[t.getAttribute('data-row')] = t.value;
  }
});
app.addEventListener('input', function (e) {
  if (e.target.id === 'numin') { var p = curProblem(); U(p.id).txt = e.target.value; }
});
app.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'numin') { e.preventDefault(); doCheck(); }
});

/* ---------- start (supports plain #token links) ---------- */
(function init() {
  try {
    var h = (window.location.hash || '').replace('#', '');
    if (h === 'progress') v.name = 'progress';
    else {
      var m = h.match(/^(linear|systems|stats)-(review|practice)$/);
      if (m) { v.name = 'section'; v.sec = m[1]; v.tab = m[2]; }
    }
  } catch (e) { }
  render({});
})();
</script>
</body>
